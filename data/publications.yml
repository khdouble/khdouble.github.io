# Publication list for khdouble.github.io
#
# To add an entry: copy a block into the right section, then run
#   python build.py && quarto render
#
# Fields
#   title   : required
#   authors : co-authors only, in printed order (the site owner is implicit)
#   venue   : journal / outlet name
#   detail  : volume(issue):pages, or a status such as "Forthcoming" / "submitted"
#   lang    : "ko" when the work itself is in Korean
#   url     : canonical landing page (DOI preferred); repo-relative path for a local PDF
#   extras  : supplementary links -> {label, href}

